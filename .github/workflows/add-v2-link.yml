name: Add Sleeping Stars v2 links

on:
  push:
    paths:
      - '.github/workflows/add-v2-link.yml'

permissions:
  contents: write

jobs:
  patch-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add v2 links to Japanese and English pages
        shell: python
        run: |
          from pathlib import Path

          v2_ja = 'https://ennea5w4.github.io/sleeping-stars-v2/'
          v2_en = 'https://ennea5w4.github.io/sleeping-stars-v2/en/'

          ja = Path('index.html')
          text = ja.read_text(encoding='utf-8')
          if v2_ja not in text:
              anchor = '    <a class="lang-link" href="https://ennea5w4.github.io/sleeping-stars/index_en">English version はこちら</a>\n'
              addition = anchor + f'    <a class="lang-link" href="{v2_ja}" target="_blank" rel="noopener">✦ 新しい Sleeping Stars v2 はこちら</a>\n'
              if anchor not in text:
                  raise SystemExit('Japanese insertion anchor not found')
              ja.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          en = Path('index_en.html')
          text = en.read_text(encoding='utf-8')
          if v2_en not in text:
              anchor = '    <img class="hero" src="img/journey_top_en.png" alt="Sleeping Stars Journey" onclick="start()" style="cursor:pointer">\n'
              link = f'    <a href="{v2_en}" target="_blank" rel="noopener" style="display:inline-block;margin-top:14px;padding:8px 18px;font-size:12px;letter-spacing:.08em;color:#f2cf7a;text-decoration:none;border:1px solid rgba(242,207,122,.45);border-radius:999px;background:rgba(255,255,255,.04);backdrop-filter:blur(8px)">✦ Try the new Sleeping Stars v2</a>\n'
              if anchor not in text:
                  raise SystemExit('English insertion anchor not found')
              en.write_text(text.replace(anchor, anchor + link, 1), encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index_en.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add links from v1 to Sleeping Stars v2"
          git push
